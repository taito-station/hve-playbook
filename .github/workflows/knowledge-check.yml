# knowledge の検査（ADR 0027）。tests/ の全件はここでは流さない（ADR 0025）
name: knowledge-check

on:
  pull_request:
    branches: [main]
    # edited: base を別ブランチから main に付け替えたときも流す（必須チェックが来ずに止まらないように）
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: knowledge-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  knowledge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 hve-scripts/check-knowledge.py
      # HEAD は main との merge commit。並行 PR が先に main へ入れた ADR の番号との重複もここで出る
      - run: python3 hve-scripts/check-decision-log.py --base "origin/$BASE_REF" --head HEAD
        env:
          BASE_REF: ${{ github.base_ref }}
